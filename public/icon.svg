<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Willow">
  <!--
    src/app/icon.png(256×256)과 같은 그림을 벡터로 옮긴 것이다. 새 로고가
    아니라 같은 잎이다 — 설치 아이콘은 192·512 를 요구하는데 원본이 256px
    래스터뿐이라 512 로 키우면 뭉갠다.

    모양은 지어낸 것이 아니라 원본에서 <b>재어</b> 냈다. 잎은 반지름 167.13
    인 두 원의 교집합(vesica)이고, 중심은 (215.84,40.16)·(40.16,215.84) 이다.
    원본 화소와 맞춰 본 결과 어긋나는 것은 경계의 안티에일리어싱뿐이다.

    색은 원본에서 그대로 뽑았다 — 바탕 #FAF9F6, 잎 #87CEEB(skyblue).
    둥근 모서리 반지름 48 은 알파 채널의 모서리 곡선에서 재었다.
  -->
  <rect width="256" height="256" rx="48" ry="48" fill="#FAF9F6"/>
  <path fill="#87CEEB"
        d="M 48.95 48.95 A 167.13 167.13 0 0 0 207.05 207.05 A 167.13 167.13 0 0 0 48.95 48.95 Z"/>
</svg>
